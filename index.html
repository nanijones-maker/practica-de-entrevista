<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armá tu CV — constructor guiado</title>
<meta name="description" content="Constructor de CV guiado paso a paso, con reglas concretas para tu primer currículum. Gratis, sin registro.">
<meta name="theme-color" content="#9E1455">
<meta property="og:title" content="Armá tu CV">
<meta property="og:description" content="Construí tu CV paso a paso, con reglas claras. Sin registro.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%239E1455'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='%23fff'/%3E%3Crect x='12' y='11' width='8' height='1.6' fill='%23C81E6E'/%3E%3Crect x='12' y='15' width='8' height='1.2' fill='%23E8C9D8'/%3E%3Crect x='12' y='18' width='5' height='1.2' fill='%23E8C9D8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — la app tiene personalidad; el documento es sobrio
   ============================================================ */
:root{
  --ink:#1A1A1A; --ink-soft:#565656; --ink-faint:#8C8C8C;
  --surface:#FFFFFF; --surface-2:#FFF7FB; --paper:#FFFFFF;
  --fucsia:#C81E6E; --fucsia-dark:#9E1455; --fucsia-pale:#FBDCEA;
  --rosa:#E9578C; --rosa-pale:#FDEAF1;
  --naranja:#E8590C; --naranja-dark:#C2410C; --naranja-pale:#FFE8D6;
  --bar:#9E1455;
  --amber:#8F5D10; --amber-pale:#F6EBD6;
  --brick:#9E3427; --brick-pale:#F6E2DE;
  --line:#EBD8E2;
  --ui:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --doc-serif:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --doc-sans:"Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui);background:var(--surface);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
:focus-visible{outline:3px solid var(--fucsia);outline-offset:2px;border-radius:4px}

/* ============================================================ ESTRUCTURA */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--bar);color:#fff}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;min-width:0}
.brand span{color:var(--naranja-pale)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.savechip{font-size:13px;color:#F6DCE8;display:flex;align-items:center;gap:7px}
.savechip i{width:7px;height:7px;border-radius:50%;background:var(--rosa-pale);display:inline-block}
.linkbtn{background:none;border:none;color:#F6DCE8;font-size:13px;text-decoration:underline;
  text-underline-offset:3px;padding:6px}
.linkbtn:hover{color:#fff}
.dlbtn{background:var(--naranja);color:#fff;border:none;border-radius:999px;
  padding:9px 18px;font-size:14px;font-weight:700;white-space:nowrap}
.dlbtn:hover{background:var(--naranja-dark)}

.steps{display:flex;gap:2px;background:var(--bar);padding:0 16px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepbtn{flex:0 0 auto;background:none;border:none;color:#EFC2D5;padding:10px 14px 14px;
  display:flex;align-items:baseline;gap:8px;border-bottom:3px solid transparent;white-space:nowrap}
.stepbtn b{font-size:11px;font-variant-numeric:tabular-nums;opacity:.7}
.stepbtn span{font-size:14px;font-weight:500}
.stepbtn:hover{color:#FBE4EF}
.stepbtn.on{color:#fff;border-bottom-color:var(--naranja)}
.stepbtn.done b::after{content:" ✓";color:var(--naranja)}

.cols{flex:1;display:flex;align-items:flex-start}
.formCol{flex:1 1 54%;min-width:0;padding:32px 32px 120px;max-width:760px}
.paperCol{flex:1 1 46%;min-width:0;align-self:stretch;background:var(--surface-2);
  border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}

/* ============================================================ FORMULARIO */
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fucsia-dark);
  font-weight:600;margin-bottom:6px}
h1.stepTitle{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,38px);
  line-height:1.1;letter-spacing:-.02em;margin:0 0 10px}
.stepLead{color:var(--ink-soft);margin:0 0 24px;max-width:52ch}

.field{margin-bottom:22px}
.field > label{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.rule{font-size:13.5px;color:var(--ink-soft);margin:0 0 8px}
.field input[type=text],.field input[type=email],.field input[type=tel],
.field textarea,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--ink)}
.field textarea{resize:vertical;min-height:110px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fucsia)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row > .field{flex:1 1 200px;margin-bottom:22px}

.fb{margin-top:7px;display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;
  padding:8px 11px;border-radius:8px}
.note.ok{background:var(--fucsia-pale);color:var(--fucsia-dark)}
.note.warn{background:var(--amber-pale);color:var(--amber)}
.note.bad{background:var(--brick-pale);color:var(--brick)}
.note .mark{font-weight:700;flex:0 0 auto}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1.5px solid var(--fucsia);color:var(--fucsia-dark);border-radius:999px;
  padding:5px 12px;font-size:13.5px;font-weight:500}
.chip:hover{background:var(--fucsia);color:#fff}

.card{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:18px;margin-bottom:16px}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cardhead h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0;flex:1}
.del{background:none;border:1.5px solid var(--line);border-radius:8px;color:var(--ink-soft);
  font-size:13px;padding:5px 10px}
.del:hover{border-color:var(--brick);color:var(--brick)}
.addbtn{width:100%;padding:13px;border:1.5px dashed var(--line);background:#fff;border-radius:14px;
  color:var(--fucsia-dark);font-weight:600}
.addbtn:hover{border-color:var(--fucsia);background:var(--fucsia-pale)}

.bullet{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.bullet:last-of-type{border-bottom:none}
.bulletTop{display:flex;gap:8px;align-items:flex-start}
.bulletTop textarea{flex:1;min-height:62px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;line-height:1.5;resize:vertical}
.bulletTop textarea:focus{border-color:var(--fucsia)}
.bulletTop .del{align-self:stretch;padding:0 10px}

/* asistente de frase */
.assistbtn{background:none;border:none;color:var(--fucsia-dark);font-size:13.5px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;padding:6px 0;margin-top:4px}
.formula{border:1.5px solid var(--fucsia-pale);background:var(--surface-2);border-radius:12px;
  padding:14px;margin-top:8px}
.formula p.f-lead{margin:0 0 12px;font-size:13.5px;color:var(--ink-soft)}
.formula p.f-lead b{color:var(--fucsia-dark)}
.fline{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.fline .fnum{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--fucsia);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center}
.fline input{flex:1;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.fline input:focus{border-color:var(--fucsia)}
.fprev{font-size:13.5px;background:#fff;border:1.5px solid var(--line);border-radius:9px;
  padding:10px 12px;margin:10px 0;color:var(--ink);min-height:20px}
.fprev.empty{color:var(--ink-faint)}
.formula .btn{padding:9px 16px;font-size:14px}

.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{background:var(--fucsia-pale);color:var(--fucsia-dark);border:none;border-radius:999px;
  padding:6px 12px;font-size:14px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.tag button{background:none;border:none;color:inherit;font-size:15px;line-height:1;padding:0;opacity:.65}
.tag button:hover{opacity:1}
.inlineadd{display:flex;gap:8px}
.inlineadd input{flex:1;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
.inlineadd button{background:var(--fucsia);color:#fff;border:none;border-radius:var(--r);padding:0 18px;font-weight:600}
.inlineadd button:hover{background:var(--fucsia-dark)}
.suggest{margin-top:10px}
.suggest .lbl{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.checkline{display:flex;gap:9px;align-items:center;margin-top:8px;font-size:14.5px;color:var(--ink-soft)}
.checkline input{width:18px;height:18px;accent-color:var(--fucsia)}

/* fila con inputs alineados aunque las descripciones tengan distinto largo */
.row.align > .field{display:flex;flex-direction:column}
.row.align > .field > .rule{flex:1 0 auto}
.row.align > .field > input,
.row.align > .field > select,
.row.align > .field > .fechapair{margin-top:auto}

/* foto opcional */
.fotobox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.fotoprev{flex:0 0 auto;width:96px;height:96px;border-radius:50%;overflow:hidden;
  border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.fotoprev img{width:100%;height:100%;object-fit:cover;display:block}
.fotoprev .ph{font-size:12px;color:var(--ink-faint);text-align:center;padding:8px;line-height:1.35}
.fotoacc{flex:1 1 220px;min-width:0}
.fotoacc .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filebtn{display:inline-block;background:#fff;border:1.5px solid var(--fucsia);color:var(--fucsia-dark);
  border-radius:var(--r);padding:10px 16px;font-weight:600;font-size:14px}
.filebtn:hover{background:var(--fucsia);color:#fff}
.fotobox input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* sugerencias por renglón */
.lineas{margin-top:9px;display:flex;flex-direction:column;gap:8px}
.linea{border:1.5px solid var(--amber-pale);background:var(--amber-pale);border-radius:10px;padding:10px 12px}
.linea.ok{border-color:var(--fucsia-pale);background:var(--fucsia-pale)}
.linea .lt{font-size:13.5px;color:var(--ink);margin:0 0 4px;display:flex;gap:8px}
.linea .lt b{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.linea .lm{font-size:13px;margin:0 0 8px;color:var(--amber)}
.linea.ok .lm{color:var(--fucsia-dark);margin-bottom:0}
.linea .chips{margin-top:0}
.fechapair{display:flex;gap:8px}
.fechapair select{flex:1 1 auto;min-width:0;padding:11px 9px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--ink)}
.fechapair select:focus{border-color:var(--fucsia)}
.fechapair select:disabled{background:#FAF4F7;color:var(--ink-faint)}
.fechapair select.mes{flex:1.35 1 0}
.fechapair select.anio{flex:1 1 0}

/* barra de ayuda debajo de los campos largos */
.aibar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.example{margin:0 0 26px}
.example > summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--fucsia-dark);
  padding:9px 13px;background:var(--fucsia-pale);border-radius:var(--r);list-style:none;display:inline-block}
.example > summary::-webkit-details-marker{display:none}
.example > summary::before{content:"◦ "}
.example[open] > summary{border-radius:var(--r) var(--r) 0 0;display:block}
.exbody{border:1.5px solid var(--fucsia-pale);border-top:none;border-radius:0 0 var(--r) var(--r);
  padding:16px;font-size:14.5px;background:#fff}
.exbody p{margin:0 0 10px}
.exbody ul{margin:0;padding-left:20px}
.exbody li{margin-bottom:6px}
.exbody em{color:var(--ink-soft);font-style:normal;font-size:13.5px}

.nav{display:flex;gap:12px;margin-top:36px}
.btn{border-radius:var(--r);padding:13px 22px;font-weight:600;border:1.5px solid transparent}
.btn.primary{background:var(--fucsia);color:#fff}
.btn.primary:hover{background:var(--fucsia-dark)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-soft)}
.nav .spacer{flex:1}

.score{display:flex;gap:20px;align-items:baseline;padding:20px;background:#fff;
  border:1.5px solid var(--line);border-radius:14px;margin-bottom:22px}
.score .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.score p{margin:0;color:var(--ink-soft);font-size:14.5px}
.checkitem{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--line)}
.checkitem:last-of-type{border-bottom:1px solid var(--line)}
.dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;margin-top:2px;display:grid;
  place-items:center;font-size:13px;font-weight:700;color:#fff}
.dot.ok{background:var(--fucsia)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--brick)}
.checkitem .txt{flex:1}
.checkitem .txt b{display:block;font-size:15px}
.checkitem .txt span{font-size:13.8px;color:var(--ink-soft)}
.checkitem .goto{background:none;border:none;color:var(--fucsia-dark);font-size:13.5px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px;align-self:center;flex:0 0 auto}
.exportbox{margin-top:28px;padding:22px;background:var(--bar);color:#fff;border-radius:14px}
.exportbox h3{font-family:var(--display);font-weight:800;margin:0 0 6px;font-size:22px}
.exportbox p{margin:0 0 16px;color:#F6DCE8;font-size:14.5px;max-width:46ch}
.exportbox .btn.primary{background:var(--naranja);color:#fff}
.exportbox .btn.primary:hover{background:var(--naranja-dark)}

/* ============================================================ PANEL DE LA HOJA */
.paperTools{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.paperTools .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.zoombtn{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink)}
.zoombtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.fitpill{margin-left:auto;font-size:13px;padding:5px 12px;border-radius:999px;font-weight:600}
.fitpill.ok{background:var(--fucsia-pale);color:var(--fucsia-dark)}
.fitpill.over{background:var(--brick-pale);color:var(--brick)}

.designbar{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.dgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dgroup:last-child{margin-bottom:0}
.dgroup > .dlbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;flex:0 0 62px}
.tpl{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.tpl.on{border-color:var(--ink);background:var(--ink);color:#fff}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}

.scaler{position:relative;width:100%}
.sheet{width:794px;min-height:1123px;background:var(--paper);transform-origin:top left;
  box-shadow:0 1px 2px rgba(19,32,43,.12),0 12px 34px rgba(19,32,43,.13);position:relative;
  color:#1A1A1A;padding:56px 60px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.pagemark{position:absolute;left:0;right:0;top:1123px;border-top:2px dashed var(--brick);pointer-events:none}
.pagemark::after{content:"Fin de la página 1";position:absolute;right:0;top:6px;font-family:var(--ui);
  font-size:12px;font-weight:600;color:var(--brick);background:var(--brick-pale);padding:3px 8px;border-radius:0 0 6px 6px}

/* ============================================================ DOCUMENTO — base */
.sheet{--acc:#2B3A42;--doc-fs:12.9px;--doc-gap:20px;--doc-lh:1.55}
.sheet.d-compacto{--doc-fs:12.1px;--doc-gap:14px;--doc-lh:1.42}
.doc-head{margin-bottom:24px}
.doc-name{font-size:31px;font-weight:700;letter-spacing:-.015em;margin:0 0 6px;line-height:1.1;color:#111}
.doc-contact{font-size:12.2px;color:#3A3A3A;margin:0;line-height:1.7}
.doc-contact span+span::before{content:"  ·  ";color:#A8A8A8}
.doc-sec{margin-bottom:var(--doc-gap)}
.doc-sec:last-child{margin-bottom:0}
.doc-sec > h2{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:0 0 9px}
.doc-p{font-size:var(--doc-fs);line-height:var(--doc-lh);margin:0;color:#262626}
.doc-item{margin-bottom:12px}
.doc-item:last-child{margin-bottom:0}
.doc-itemhead{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.doc-role{font-size:13.4px;font-weight:700;margin:0;color:#111}
.doc-kind{font-weight:400;color:#5A5A5A}
.doc-org{font-size:12.4px;color:#444;margin:1px 0 4px}
.doc-dates{font-size:11.4px;color:#666;white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}
.doc-ul{margin:5px 0 0;padding-left:15px;list-style:none}
.doc-ul li{font-size:var(--doc-fs);line-height:var(--doc-lh);margin-bottom:4px;color:#262626;position:relative}
.doc-ul li::before{content:"";position:absolute;left:-13px;top:.62em;width:5px;height:1.5px;background:var(--acc)}
.doc-skills{font-size:var(--doc-fs);line-height:1.7;margin:0;color:#262626}
.doc-skills .sep{color:#B4B4B4;padding:0 3px}
.doc-empty{color:#B4BDC2}
.doc-placeholder{font-family:var(--ui);color:#AEB8BE;font-size:13px;line-height:1.6;
  border:1.5px dashed #DCE2E5;border-radius:8px;padding:16px}

/* --- Plantilla: Clásico (serif, encabezado centrado, filete completo) --- */
.sheet.t-clasico{font-family:var(--doc-sans)}
.sheet.t-clasico .doc-head{text-align:center;padding-bottom:16px;border-bottom:2px solid #1A1A1A;margin-bottom:22px}
.sheet.t-clasico .doc-name{font-family:var(--doc-serif);font-size:33px;font-weight:600;letter-spacing:.01em}
.sheet.t-clasico .doc-sec > h2{font-family:var(--doc-serif);font-weight:600;color:#1A1A1A;
  border-bottom:1px solid #CFCFCF;padding-bottom:5px}
.sheet.t-clasico .doc-role{font-family:var(--doc-serif);font-weight:700}

/* --- Plantilla: Moderno (sans, rótulos con filete al costado) --- */
.sheet.t-moderno{font-family:var(--doc-sans)}
.sheet.t-moderno .doc-head{padding-bottom:14px;border-bottom:3px solid var(--acc);margin-bottom:22px}
.sheet.t-moderno .doc-name{font-weight:700}
.sheet.t-moderno .doc-sec > h2{color:var(--acc);display:flex;align-items:center;gap:12px}
.sheet.t-moderno .doc-sec > h2::after{content:"";flex:1;height:1px;background:#DADADA}
.sheet.t-moderno .doc-dates{color:var(--acc);font-weight:600}

/* --- Plantilla: Encabezado (bloque tramado + barra lateral en rótulos) --- */
.sheet.t-encabezado{font-family:var(--doc-sans)}
.sheet.t-encabezado .doc-head{background:var(--acc);color:#fff;margin:-56px -60px 24px;padding:38px 60px 30px}
.sheet.d-compacto.t-encabezado .doc-head{margin:-56px -60px 20px;padding:30px 60px 24px}
.sheet.t-encabezado .doc-name{color:#fff;font-weight:700}
.sheet.t-encabezado .doc-contact{color:rgba(255,255,255,.88)}
.sheet.t-encabezado .doc-contact span+span::before{color:rgba(255,255,255,.5)}

/* ============================================================ MOBILE */
.mobilebar{display:none}
.closepaper{display:none}
@media (max-width:980px){
  .cols{display:block}
  .formCol{max-width:none;padding:22px 18px 132px}
  /* oculta pero medible: con display:none, scrollHeight da 0 y el chequeo
     de "entra en una página" mentía mientras la hoja estaba cerrada */
  .paperCol{position:fixed;inset:0;height:100vh;z-index:60;border-left:none;padding:14px;
    visibility:hidden;pointer-events:none}
  body.showpaper .paperCol{visibility:visible;pointer-events:auto}
  body.showpaper{overflow:hidden}
  .closepaper{display:inline-block;background:var(--ink);color:#fff;border:none;border-radius:var(--r);

  .topbar .savechip{display:none}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================ IMPRESIÓN → PDF */
@media print{
  @page{size:A4;margin:15mm 16mm}
  html,body{background:#fff}
  .topbar,.steps,.formCol,.mobilebar,.paperTools,.designbar,.pagemark,.closepaper{display:none!important}
  .app,.cols{display:block!important;padding:0!important;margin:0!important}
  .paperCol{display:block!important;position:static!important;height:auto!important;border:none!important;
    padding:0!important;background:#fff!important;overflow:visible!important;
    visibility:visible!important;pointer-events:auto!important}
  .scaler{height:auto!important}
  .sheet{transform:none!important;width:auto!important;min-height:auto!important;
    box-shadow:none!important;padding:0!important}

  /* el bloque de color del encabezado sangra hasta el borde de la hoja */
  .sheet.t-encabezado .doc-head{margin:-15mm -16mm 9mm!important;padding:13mm 16mm 10mm!important}

  /* Saltos de página:
     las secciones SÍ pueden cortarse (si no, quedan huecos enormes),
     pero un encabezado nunca queda solo al pie de una página. */
  .doc-sec{break-inside:auto}
  .doc-sec > h2{break-after:avoid;break-inside:avoid}
  .doc-head{break-after:avoid}
  .doc-item{break-inside:avoid;break-after:auto}
  .doc-ul li{break-inside:avoid}
  .doc-p{orphans:3;widows:3}
  /* si una sección arranca cerca del pie, que se lleve su primer ítem consigo */
  .doc-sec > h2 + .doc-item,
  .doc-sec > h2 + .doc-p,
  .doc-sec > h2 + .doc-skills{break-before:avoid}
}

<script>
/* ============================================================
   ALMACENAMIENTO
   En Claude usa window.storage; deployado usa localStorage.
   ============================================================ */
const KEY = "armar-mi-cv:v2";
/* la ayuda con IA ya no existe: borramos la clave que hubiera quedado guardada */
try{ localStorage.removeItem("armar-mi-cv:apikey"); }catch(e){}
const store = {
  async get(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); return r && r.value; } }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){ return null; }
  },
  async set(v){
    try{ if(window.storage){ await window.storage.set(KEY, v); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, v); return true; }catch(e){ return false; }
  },
  async del(){
    try{ if(window.storage){ await window.storage.delete(KEY); return; } }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ============================================================ ESTADO */
let uid = 1;
const nid = () => "i" + (uid++) + Date.now().toString(36).slice(-3);
const blankExp = () => ({id:nid(), tipo:"trabajo", puesto:"", org:"",
  desdeMes:"", desdeAnio:"", hastaMes:"", hastaAnio:"", actual:false, bullets:[""]});
const blankEdu = () => ({id:nid(), titulo:"", inst:"",
  desdeMes:"", desdeAnio:"", hastaMes:"", hastaAnio:"", estado:"En curso"});
const blankCur = () => ({id:nid(), nombre:"", inst:"", mes:"", anio:""});
const blankIdi = () => ({id:nid(), idioma:"", nivel:"Intermedio"});
/* el CV arranca con el idioma que todos comparten; se puede editar o borrar */
const idiomaBase = () => ({id:nid(), idioma:"Español", nivel:"Nativo"});

/* Nombre en mayúscula inicial.
   Solo interviene si vino TODO en mayúsculas o TODO en minúsculas: si ya trae
   mayúsculas propias no lo toca, para no romper "McCarthy" ni "de la Vega". */
const PARTICULAS = new Set(["de","del","la","las","los","y","e","da","das","do","dos","van","von","di","du","der","den","bin","ibn"]);
function capitalizarNombre(txt){
  const t = (txt||"").trim().replace(/\s+/g," ");
  if(!t) return "";
  const letras = t.replace(/[^\p{L}]/gu,"");
  if(!letras) return t;
  const soloMayus = letras === letras.toUpperCase();
  const soloMinus = letras === letras.toLowerCase();
  if(!soloMayus && !soloMinus) return t;
  const alta = w => w.replace(/^(\p{L})/u, c=>c.toUpperCase())
                     .replace(/([-'\u2019])(\p{L})/gu, (m,sep,c)=>sep+c.toUpperCase());
  return t.toLowerCase().split(" ")
    .map((w,i)=> i>0 && PARTICULAS.has(w) ? w : alta(w))
    .join(" ");
}

/* ---- fechas: mes + año en todo el CV ---- */
const MESES = [
  {v:"01", corto:"Ene", largo:"Enero"},   {v:"02", corto:"Feb", largo:"Febrero"},
  {v:"03", corto:"Mar", largo:"Marzo"},   {v:"04", corto:"Abr", largo:"Abril"},
  {v:"05", corto:"May", largo:"Mayo"},    {v:"06", corto:"Jun", largo:"Junio"},
  {v:"07", corto:"Jul", largo:"Julio"},   {v:"08", corto:"Ago", largo:"Agosto"},
  {v:"09", corto:"Sep", largo:"Septiembre"}, {v:"10", corto:"Oct", largo:"Octubre"},
  {v:"11", corto:"Nov", largo:"Noviembre"},  {v:"12", corto:"Dic", largo:"Diciembre"}
];
const ANIO_ACTUAL = new Date().getFullYear();
const ANIOS = Array.from({length:41}, (_,i)=>String(ANIO_ACTUAL + 2 - i));
/* una carrera en curso se termina bastante más adelante: llega hasta ANIO_ACTUAL+9 */
const ANIOS_ESTUDIO = Array.from({length:48}, (_,i)=>String(ANIO_ACTUAL + 9 - i));
const mesCorto = v => (MESES.find(m=>m.v===v)||{}).corto || "";

/* selector mes+año reutilizable */
function selectorFecha(attrs, mes, anio, opts){
  opts = opts || {};
  const dis = opts.disabled ? " disabled" : "";
  const etiquetaMes = opts.mesVacio || "Mes";
  const etiquetaAnio = opts.anioVacio || "Año";
  const om = '<option value="">'+etiquetaMes+'</option>' +
    MESES.map(m=>'<option value="'+m.v+'"'+(mes===m.v?" selected":"")+'>'+m.largo+'</option>').join("");
  const oa = '<option value="">'+etiquetaAnio+'</option>' +
    (opts.anios || ANIOS).map(a=>'<option value="'+a+'"'+(anio===a?" selected":"")+'>'+a+'</option>').join("");
  return '<div class="fechapair">'+
    '<select class="mes" '+attrs+' data-parte="mes" aria-label="Mes"'+dis+'>'+om+'</select>'+
    '<select class="anio" '+attrs+' data-parte="anio" aria-label="Año"'+dis+'>'+oa+'</select></div>';
}

const ACENTOS = [
  {n:"Grafito", v:"#2B3A42"},
  {n:"Vino",    v:"#7B2D3B"},
  {n:"Fucsia",  v:"#B0175E"},
  {n:"Naranja", v:"#C2410C"}
];

let S = {
  contacto:{nombre:"", mail:"", tel:"", ciudad:"", linkedin:""},
  foto:"",
  perfil:"", exp:[blankExp()], edu:[blankEdu()], cursos:[], habilidades:[], idiomas:[idiomaBase()],
  diseno:{plantilla:"clasico", acento:"#2B3A42", densidad:"comodo"},
  visitados:[0]
};
let paso = 0, sobra = 0;

/* ============================================================ REGLAS */
const norm = t => (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

const ARRANQUES_DEBILES = ["fui responsable de","era responsable de","me encargaba de","me encargue de",
  "estuve a cargo de","mis tareas eran","mis tareas incluian","me ocupaba de","estaba a cargo de",
  "fui responsable","era responsable","responsable de","encargado de","encargada de","me encargaba",
  "me encargue","estuve a cargo","a cargo de","mis tareas","tareas de","funciones","ayudaba a","ayudaba",
  "ayude a","participaba en","participaba","participe en","participe","trabajaba en","trabajaba",
  "trabaje en","trabaje","colaboraba en","colaboraba","apoyaba","me ocupaba","hacia ","yo "]
  .sort((a,b)=>b.length-a.length);

/* quita acentos conservando el largo, para poder cortar prefijos con precisión */
const DEACC = {"á":"a","é":"e","í":"i","ó":"o","ú":"u","ü":"u","ñ":"n","Á":"a","É":"e","Í":"i","Ó":"o","Ú":"u","Ü":"u","Ñ":"n"};
const planar = t => (t||"").split("").map(ch => DEACC[ch] || ch.toLowerCase()).join("");

/* reemplaza el arranque flojo por un verbo, sin dejar restos raros */
function reemplazarVerbo(txt, verbo){
  const original = (txt||"").trim();
  if(!original) return verbo + " ";
  const plano = planar(original);
  for(const d of ARRANQUES_DEBILES){
    const corte = d.trimEnd().length;
    const sigue = plano.charAt(corte);
    if(plano.startsWith(d.trimEnd()) && (sigue==="" || sigue===" ")){
      let resto = original.slice(corte).trim();
      resto = resto.replace(/^del\s+/i, "el ").replace(/^(de|que|por|en)\s+/i, "");
      /* si quedó un infinitivo suelto, sobra: el verbo nuevo ya dice la acción */
      resto = resto.replace(/^[a-záéíóúñ]+(ar|er|ir)\s+/i, "");
      return (verbo + " " + resto).trim();
    }
  }
  return (verbo + " " + original).trim();
}
const IRREGULARES = ["hice","puse","tuve","mantuve","estuve","traduje","conduje","produje","fui","di","vi","supe","pude","quise"];

const VERBOS = {
  trabajo:      ["Atendí","Coordiné","Gestioné","Vendí","Organicé","Resolví"],
  pasantia:     ["Colaboré","Analicé","Preparé","Registré","Investigué","Presenté"],
  voluntariado: ["Coordiné","Convoqué","Acompañé","Organicé","Difundí","Capacité"],
  proyecto:     ["Creé","Diseñé","Armé","Programé","Publiqué","Lancé"]
};
const HAB_SUGERIDAS = ["Excel intermedio","Google Sheets","Google Workspace","Word","Canva","Tango Gestión",
  "Facturación AFIP","Atención al cliente","Caja y arqueo","Redes sociales","Photoshop","Python","SQL","Trello"];

const SENSIBLES = [
  {re:/\bd\.?n\.?i\.?\b|documento nacional/i, que:"tu DNI"},
  {re:/\bcuil\b|\bcuit\b/i, que:"tu CUIL o CUIT"},
  {re:/estado civil|\bsolter[oa]\b|\bcasad[oa]\b|\bdivorciad[oa]\b/i, que:"tu estado civil"},
  {re:/fecha de nacimiento|nac[ií] el|\baños de edad\b|\bedad\s*:/i, que:"tu edad o fecha de nacimiento"},
  {re:/\breligi[oó]n\b|\bsexo\s*:|\bnacionalidad\s*:/i, que:"ese dato personal"}
];
const MAIL_INFORMAL = ["sexy","loco","loca","nena","nene","papu","bebe","xd","jaja","666","xxx","princes","kpo","crack","cheto"];

function chequeoArranque(txt, tipo){
  const t = norm(txt);
  if(t.length < 4) return null;
  for(const d of ARRANQUES_DEBILES)
    if(t.startsWith(d)) return {nivel:"warn", msg:"Arranca flojo. Contá qué hiciste vos, con un verbo directo.", verbos:VERBOS[tipo]||VERBOS.trabajo};
  const w1 = t.split(/\s+/)[0] || "";
  const primera = (txt||"").trim().split(/\s+/)[0] || "";
  const esVerbo = /(é|í)$/.test(primera) || IRREGULARES.includes(w1);
  if(!esVerbo) return {nivel:"warn", msg:"Empezá con un verbo en primera persona: qué hiciste vos.", verbos:VERBOS[tipo]||VERBOS.trabajo};
  return {nivel:"ok", msg:"Empieza con un verbo. Así se lee."};
}
function chequeoNumeros(txt){
  const t = (txt||"").trim();
  if(t.length < 12) return null;
  if(/\d/.test(t)) return {nivel:"ok", msg:"Tiene un número. Eso lo hace concreto."};
  return {nivel:"warn", msg:"Sumá un número: cuántas personas, cuántos por día, cada cuánto, de cuánto."};
}
/* fechas incoherentes o incompletas */
function chequeoFechas(dMes,dAnio,hMes,hAnio,actual){
  const dA = parseInt(dAnio||"0",10), hA = parseInt(hAnio||"0",10);
  if(dMes && !dAnio) return {nivel:"warn", msg:"Elegiste el mes pero falta el año."};
  if(!dAnio) return null;
  if(!actual && hAnio){
    if(hA < dA) return {nivel:"bad", msg:"La fecha de fin es anterior a la de inicio."};
    if(hA === dA && dMes && hMes && parseInt(hMes,10) < parseInt(dMes,10))
      return {nivel:"bad", msg:"El mes de fin es anterior al de inicio."};
  }
  if(dA > ANIO_ACTUAL) return {nivel:"warn", msg:"Ese año todavía no llegó. Revisalo."};
  if(!actual && !hAnio) return {nivel:"warn", msg:"Falta la fecha de fin, o marcá “Sigo acá”."};
  return {nivel:"ok", msg:"Fechas completas."};
}

function chequeoSensible(txt){
  for(const s of SENSIBLES)
    if(s.re.test(txt||"")) return {nivel:"bad", msg:"Sacá "+s.que+". En Argentina no va en el CV y puede jugarte en contra."};
  return null;
}
function chequeoMail(mail){
  const m = (mail||"").trim();
  if(!m) return null;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return {nivel:"bad", msg:"Ese mail está incompleto. Fijate que tenga @ y el punto del final."};
  const local = norm(m.split("@")[0]);
  const feo = MAIL_INFORMAL.some(f => local.includes(f)) || (local.match(/\d/g)||[]).length >= 5;
  if(feo) return {nivel:"warn", msg:"Ese mail suena informal. Creá uno con tu nombre y apellido, tarda dos minutos."};
  return {nivel:"ok", msg:"Mail claro."};
}

/* ============================================================
   FOTO — se recorta cuadrada y se achica antes de guardar
   ============================================================ */
function procesarFoto(file){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith("image/")) return reject(new Error("Ese archivo no es una imagen."));
    if(file.size > 12*1024*1024) return reject(new Error("La imagen pesa demasiado. Probá con una más chica."));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error("No se pudo leer el archivo."));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("No se pudo abrir la imagen."));
      img.onload = ()=>{
        const LADO = 400;
        const min = Math.min(img.width, img.height);
        const sx = (img.width - min)/2, sy = (img.height - min)/2;
        const cv = document.createElement("canvas");
        cv.width = cv.height = LADO;
        const cx = cv.getContext("2d");
        cx.fillStyle = "#fff"; cx.fillRect(0,0,LADO,LADO);
        cx.drawImage(img, sx, sy, min, min, 0, 0, LADO, LADO);
        resolve(cv.toDataURL("image/jpeg", 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const PASOS = [
  {n:"Contacto",    t:"Cómo te contactan",         lead:"Si esto está mal, no importa lo que digas después. Va todo arriba de todo, en una sola línea."},
  {n:"Perfil",      t:"Quién sos, en tres líneas", lead:"Lo primero que se lee. Decí qué sabés hacer y qué estás buscando, sin adornos."},
  {n:"Experiencia", t:"Qué hiciste",               lead:"Trabajo, pasantía, voluntariado o un proyecto propio. Todo cuenta si podés contar qué hiciste."},
  {n:"Educación",   t:"Qué estudiaste",            lead:"Tu formación y los cursos que hiciste, aunque sean cortos u online."},
  {n:"Habilidades", t:"Qué sabés usar",            lead:"Herramientas concretas e idiomas. Nada de “proactivo” ni “trabajo en equipo”."},
  {n:"Revisión",    t:"Antes de mandarlo",         lead:"Repaso todo lo que cargaste y te marco qué conviene corregir."}
];

/* ============================================================ UTILIDADES */
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = sel => document.querySelector(sel);
function notaHTML(r){
  if(!r) return "";
  const mk = r.nivel==="ok" ? "✓" : r.nivel==="bad" ? "!" : "→";
  return '<div class="note '+r.nivel+'"><span class="mark">'+mk+'</span><span>'+esc(r.msg)+'</span></div>';
}

/* ============================================================ GUARDADO */
let saveT = null;
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(save, 700); }
async function save(){
  const ok = await store.set(JSON.stringify(S));
  const c = $("#saveChip");
  if(!ok){ c.style.display = "none"; return; }
  c.innerHTML = '<i></i> Guardado';
  setTimeout(()=>{ c.innerHTML = '<i></i> Se guarda solo'; }, 1600);
}
async function load(){
  try{
    const raw = await store.get();
    if(!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(S, d);
    S.diseno = Object.assign({plantilla:"clasico",acento:"#2B3A42",densidad:"comodo"}, d.diseno||{});
    if(!S.exp || !S.exp.length) S.exp = [blankExp()];
    if(!S.edu || !S.edu.length) S.edu = [blankEdu()];
    S.visitados = S.visitados || [0];
  }catch(e){}
}

/* ============================================================ NAVEGACIÓN */
function renderNav(){
  $("#stepNav").innerHTML = PASOS.map((p,i)=>
    '<button class="stepbtn '+(i===paso?"on":"")+' '+(S.visitados.includes(i)&&i!==paso?"done":"")+'" data-goto="'+i+'">'+
    '<b>'+(i+1)+'</b><span>'+p.n+'</span></button>').join("");
  $("#stepNav").querySelectorAll("[data-goto]").forEach(b=>{ b.onclick = ()=>irA(+b.dataset.goto); });
}
function irA(i){
  paso = Math.max(0, Math.min(PASOS.length-1, i));
  if(!S.visitados.includes(paso)) S.visitados.push(paso);
  renderNav(); renderForm(); renderPreview(); scheduleSave();
  window.scrollTo(0,0);
  document.body.classList.remove("showpaper");
}

/* ============================================================ FORMULARIO */
function head(){
  const p = PASOS[paso];
  return '<div class="eyebrow">Paso '+(paso+1)+' de '+PASOS.length+'</div>'+
         '<h1 class="stepTitle">'+esc(p.t)+'</h1><p class="stepLead">'+esc(p.lead)+'</p>';
}
function ejemplo(titulo, cuerpo){
  return '<details class="example"><summary>'+esc(titulo)+'</summary><div class="exbody">'+cuerpo+'</div></details>';
}
function navBtns(){
  const last = paso===PASOS.length-1;
  return '<div class="nav">'+(paso>0?'<button class="btn ghost" data-nav="-1">Atrás</button>':'')+
    '<div class="spacer"></div>'+
    (last?'<button class="btn primary" data-print="1">Guardar como PDF</button>'
         :'<button class="btn primary" data-nav="1">Seguir</button>')+'</div>';
}

function renderForm(){
  const c = $("#formCol");
  let h = head();

  /* ---------- 1. CONTACTO ---------- */
  if(paso===0){
    h += '<div class="field"><label for="f-nombre">Nombre y apellido</label>'+

/* ============================================================ HABILIDADES */
function renderHabs(){
  const r = $("#habRow"); if(!r) return;
  r.innerHTML = S.habilidades.map((x,i)=>
    '<span class="tag">'+esc(x)+'<button data-delhab="'+i+'" aria-label="Quitar '+esc(x)+'">✕</button></span>').join("");
  r.querySelectorAll("[data-delhab]").forEach(b=>{
    b.onclick = ()=>{ S.habilidades.splice(+b.dataset.delhab,1); renderHabs(); renderHabSug(); renderPreview(); scheduleSave(); };
  });
}
function renderHabSug(){
  const r = $("#habSug"); if(!r) return;
  const libres = HAB_SUGERIDAS.filter(x=>!S.habilidades.includes(x));
  r.innerHTML = libres.map(x=>'<button class="chip" data-addhab="'+esc(x)+'">+ '+esc(x)+'</button>').join("");
  r.querySelectorAll("[data-addhab]").forEach(b=>{
    b.onclick = ()=>{ S.habilidades.push(b.dataset.addhab); renderHabs(); renderHabSug(); renderPreview(); scheduleSave(); };
  });
}
function addHab(){
  const i = $("#f-hab"); const v = (i.value||"").trim();
  if(!v) return;
  S.habilidades.push(v); i.value = "";
  renderHabs(); renderHabSug(); renderPreview(); scheduleSave(); i.focus();
}

/* ============================================================ FRASE ASISTIDA */
const fdata = {};
function frasePrevia(k){
  const d = fdata[k] || {};
  const a = (d.a||"").trim(), b = (d.b||"").trim(), c = (d.c||"").trim();
  if(!a && !b && !c) return "";
  let t = [a, b].filter(Boolean).join(" ");
  if(c) t += (t ? ", " : "") + c;
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if(t && !/[.!?]$/.test(t)) t += ".";
  return t;
}
function sincronizarTextarea(id){
  const e = S.exp.find(x=>x.id===id); if(!e) return;
  const ta = document.querySelector('[data-e="'+id+'"][data-k="bullets"]');
  if(ta) ta.value = e.bullets.join("\n");
  refrescarFeedback(); renderPreview(); scheduleSave();
}
function agregarRenglon(id, texto){
  const e = S.exp.find(x=>x.id===id); if(!e) return;
  const limpio = e.bullets.filter(b=>b.trim());
  limpio.push(texto);
  e.bullets = limpio;
  sincronizarTextarea(id);
  const ta = document.querySelector('[data-e="'+id+'"][data-k="bullets"]');
  if(ta){ ta.focus(); try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(err){} }
}

/* ============================================================ EVENTOS */
function atarEventos(){
  const c = $("#formCol");

  c.querySelectorAll("[data-c]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const k = el.dataset.c;
      if(k==="perfil") S.perfil = el.value; else S.contacto[k] = el.value;
      refrescarFeedback(); renderPreview(); scheduleSave();
    });
  });

  c.querySelectorAll("[data-e]").forEach(el=>{
    const e = S.exp.find(x=>x.id===el.dataset.e); if(!e) return;
    const k = el.dataset.k;
    const ev = (el.type==="checkbox"||el.tagName==="SELECT") ? "change" : "input";
    el.addEventListener(ev, ()=>{
      if(k==="bullets") e.bullets = el.value.split("\n");
      else if(k==="actual"){
        e.actual = el.checked;
        if(e.actual){ e.hastaMes = ""; e.hastaAnio = ""; }
        renderForm();
      }
      else if(k==="desde" || k==="hasta"){
        const campo = k + (el.dataset.parte==="mes" ? "Mes" : "Anio");
        e[campo] = el.value;
      }
      else if(k==="tipo"){ e.tipo = el.value; refrescarFeedback(); }
      else e[k] = el.value;
      refrescarFeedback(); renderPreview(); scheduleSave();
    });
  });

  c.querySelectorAll("[data-d]").forEach(el=>{
    const e = S.edu.find(x=>x.id===el.dataset.d); if(!e) return;
    el.addEventListener(el.tagName==="SELECT"?"change":"input", ()=>{
      const k = el.dataset.k;
      if(k==="desde" || k==="hasta") e[k + (el.dataset.parte==="mes" ? "Mes":"Anio")] = el.value;
      else { e[k] = el.value; if(k==="estado") renderForm(); }
      refrescarFeedback(); renderPreview(); scheduleSave();
    });
  });
  c.querySelectorAll("[data-u]").forEach(el=>{
    const e = S.cursos.find(x=>x.id===el.dataset.u); if(!e) return;
    el.addEventListener(el.tagName==="SELECT"?"change":"input", ()=>{
      if(el.dataset.k==="fecha") e[el.dataset.parte==="mes" ? "mes":"anio"] = el.value;
      else e[el.dataset.k] = el.value;
      renderPreview(); scheduleSave();
    });
  });
  c.querySelectorAll("[data-l]").forEach(el=>{
    const e = S.idiomas.find(x=>x.id===el.dataset.l); if(!e) return;
    el.addEventListener(el.tagName==="SELECT"?"change":"input", ()=>{ e[el.dataset.k]=el.value; renderPreview(); scheduleSave(); });
  });

  /* asistente de frase */
  c.querySelectorAll("[data-openf]").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.openf.split("|")[0];
      const box = document.getElementById("fm-"+id);
      const abierto = !box.hasAttribute("hidden");
      if(abierto){ box.setAttribute("hidden",""); b.textContent = "Ayudame a armar esta frase"; }
      else{ box.removeAttribute("hidden"); b.textContent = "Cerrar la ayuda"; box.querySelector("input").focus(); }
    };
  });
  c.querySelectorAll("[data-f]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const k = el.dataset.f;
      fdata[k] = fdata[k] || {};
      fdata[k][el.dataset.fp] = el.value;
      const id = k.split("|")[0];
      const p = document.getElementById("fp-"+id);
      const t = frasePrevia(k);
      p.textContent = t || "Acá va a aparecer la frase.";
      p.className = "fprev" + (t ? "" : " empty");
    });
  });
  c.querySelectorAll("[data-usef]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.usef;
      const t = frasePrevia(k);
      if(!t) return;
      const id = k.split("|")[0];
      agregarRenglon(id, t);
      const box = document.getElementById("fm-"+id);
      box.setAttribute("hidden","");
      const ab = c.querySelector('[data-openf="'+k+'"]');
      if(ab) ab.textContent = "Ayudame a armar esta frase";
    };
  });

  /* foto */
  const fi = $("#fotoInput");
  if(fi){
    fi.addEventListener("change", async ()=>{
      const f = fi.files && fi.files[0];
      if(!f) return;
      const nota = $("#fb-foto");
      nota.innerHTML = notaHTML({nivel:"ok", msg:"Procesando la imagen…"});
      try{
        S.foto = await procesarFoto(f);
        renderForm(); renderPreview(); scheduleSave();
        const n2 = $("#fb-foto");
        if(n2) n2.innerHTML = notaHTML({nivel:"ok", msg:"Foto lista. Fijate en la vista previa cómo queda."});
      }catch(err){
        nota.innerHTML = notaHTML({nivel:"bad", msg:err.message});
      }
    });
  }
  const fd = $("#fotoDel");
  if(fd) fd.onclick = ()=>{ S.foto = ""; renderForm(); renderPreview(); scheduleSave(); };

  const on = (sel, fn) => c.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on("[data-addexp]", ()=>{ S.exp.push(blankExp()); renderForm(); renderPreview(); scheduleSave(); });
  on("[data-delexp]", b=>{ S.exp = S.exp.filter(x=>x.id!==b.dataset.delexp); if(!S.exp.length) S.exp=[blankExp()]; renderForm(); renderPreview(); scheduleSave(); });
  on("[data-addedu]", ()=>{ S.edu.push(blankEdu()); renderForm(); scheduleSave(); });
  on("[data-deledu]", b=>{ S.edu = S.edu.filter(x=>x.id!==b.dataset.deledu); if(!S.edu.length) S.edu=[blankEdu()]; renderForm(); renderPreview(); scheduleSave(); });
  on("[data-addcur]", ()=>{ S.cursos.push(blankCur()); renderForm(); scheduleSave(); });
  on("[data-delcur]", b=>{ S.cursos = S.cursos.filter(x=>x.id!==b.dataset.delcur); renderForm(); renderPreview(); scheduleSave(); });
  on("[data-addidi]", ()=>{ S.idiomas.push(blankIdi()); renderForm(); scheduleSave(); });
  on("[data-delidi]", b=>{ S.idiomas = S.idiomas.filter(x=>x.id!==b.dataset.delidi); renderForm(); renderPreview(); scheduleSave(); });
  on("[data-nav]", b=>irA(paso + (+b.dataset.nav)));
  on("[data-goto]", b=>irA(+b.dataset.goto));
  on("[data-print]", descargarPDF);
  on("[data-perfilstart]", b=>{
    const ta = $("#f-perfil");
    if(!ta.value.trim()){ ta.value = b.dataset.perfilstart; S.perfil = ta.value;
      refrescarFeedback(); renderPreview(); scheduleSave(); }
    ta.focus(); try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
  });

  const ah = $("#addHab");
  if(ah){
    ah.onclick = addHab;
    $("#f-hab").addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); addHab(); } });
  }
}

/* ============================================================ FEEDBACK EN VIVO */
function refrescarFeedback(){
  if(paso===0){
    const set = (id,r)=>{ const n = $("#fb-"+id); if(n) n.innerHTML = notaHTML(r); };
    const nom = S.contacto.nombre.trim();
    set("nombre", nom ? (nom.split(/\s+/).length>=2 ? {nivel:"ok",msg:"Nombre y apellido, listo."}
      : {nivel:"warn",msg:"Falta el apellido."}) : null);
    set("mail", chequeoMail(S.contacto.mail));
    const tel = S.contacto.tel.replace(/\D/g,"");
    set("tel", S.contacto.tel.trim() ? (tel.length>=8 ? {nivel:"ok",msg:"Se puede llamar."}
      : {nivel:"warn",msg:"Parece corto. Sumá la característica."}) : null);
    set("ciudad", chequeoSensible(S.contacto.ciudad) ||
      (S.contacto.ciudad.trim() ? {nivel:"ok",msg:"Suficiente. No hace falta la dirección."} : null));
    const li = S.contacto.linkedin.trim();
    set("linkedin", li ? (/linkedin\.com/i.test(li) ? {nivel:"ok",msg:"Link correcto."}
      : {nivel:"warn",msg:"Pegá el link completo del perfil, no solo tu nombre de usuario."}) : null);
  }

  if(paso===1){
    const n = $("#fb-perfil"); if(!n) return;
    const t = S.perfil.trim();
    const pal = t ? t.split(/\s+/).length : 0;
    let out = "";
    const sens = chequeoSensible(t); if(sens) out += notaHTML(sens);
    if(pal===0){}
    else if(pal < 20) out += notaHTML({nivel:"warn",msg:"Todavía es muy corto. Falta qué sabés hacer o qué estás buscando."});
    else if(pal > 90) out += notaHTML({nivel:"warn",msg:"Se fue de largo. Nadie lee más de tres líneas acá: quedate con lo esencial."});
    else out += notaHTML({nivel:"ok",msg:"Buen largo: se lee de un vistazo."});
    if(/proactiv|trabajo en equipo|orientad[oa] a resultados|autodidacta y|din[áa]mic|responsable y/i.test(t))
      out += notaHTML({nivel:"warn",msg:"Hay frases hechas. Reemplazalas por algo concreto que hayas hecho."});
    n.innerHTML = out;
  }

  if(paso===2){
    S.exp.forEach(e=>{
      const nf = document.getElementById("fb-f-"+e.id);
      if(nf) nf.innerHTML = notaHTML(chequeoFechas(e.desdeMes,e.desdeAnio,e.hastaMes,e.hastaAnio,e.actual));

      const cont = document.getElementById("lin-"+e.id);
      if(!cont) return;

      /* un análisis por renglón: solo se muestran los que necesitan algo */
      const partes = [];
      e.bullets.forEach((linea, i)=>{
        const t = (linea||"").trim();
        if(!t) return;

        const problemas = [];
        let verbos = null;

        const sens = chequeoSensible(t);
        if(sens) problemas.push(sens.msg);

        const arr = chequeoArranque(t, e.tipo);
        if(arr && arr.nivel==="warn"){
          problemas.push(arr.msg);
          verbos = arr.verbos;
        }
        const num = chequeoNumeros(t);
        if(num && num.nivel==="warn") problemas.push(num.msg);
        if(t.split(/\s+/).length > 32) problemas.push("Muy larga: cortala en dos renglones.");

        if(!problemas.length) return;

        const corto = t.length > 64 ? t.slice(0,64)+"…" : t;
        partes.push(
          '<div class="linea">'+
            '<p class="lt"><b>'+(i+1)+'.</b><span>'+esc(corto)+'</span></p>'+
            '<p class="lm">'+esc(problemas.join(" "))+'</p>'+
            (verbos ? '<div class="chips">'+verbos.map(v=>
              '<button class="chip" data-verbo="'+e.id+'|'+i+'|'+v+'">'+v+'</button>').join("")+'</div>' : '')+
          '</div>');
      });

      const llenos = e.bullets.filter(b=>b.trim()).length;
      if(!partes.length && llenos)
        partes.push('<div class="linea ok"><p class="lm">✓ '+llenos+
          ' renglón(es) listo(s): arrancan con verbo y son concretos.</p></div>');

      cont.innerHTML = partes.join("");

      cont.querySelectorAll("[data-verbo]").forEach(btn=>{
        btn.onclick = ()=>{
          const [id,i,v] = btn.dataset.verbo.split("|");
          const ex = S.exp.find(x=>x.id===id);
          ex.bullets[+i] = reemplazarVerbo(ex.bullets[+i], v);
          const ta = document.querySelector('[data-e="'+id+'"][data-k="bullets"]');
          if(ta) ta.value = ex.bullets.join("\n");
          refrescarFeedback(); renderPreview(); scheduleSave();
        };
      });
    });
  }

  if(paso===3){
    S.edu.forEach(e=>{
      const n = document.getElementById("fb-fe-"+e.id);
      if(n) n.innerHTML = notaHTML(chequeoFechas(e.desdeMes,e.desdeAnio,e.hastaMes,e.hastaAnio,false));
    });
  }
}
/* ============================================================ CHEQUEO FINAL */
function correr(){
  const out = [];
  const add = (estado,titulo,detalle,p) => out.push({estado,titulo,detalle,paso:p});
  const C = S.contacto;

  add(C.nombre.trim().split(/\s+/).length>=2 ? "ok":"bad", "Nombre y apellido",
    C.nombre.trim() ? "Figura arriba de todo." : "Sin nombre completo el CV no sirve.", 0);

  const m = chequeoMail(C.mail);
  add(!C.mail.trim() ? "bad" : m.nivel, "Mail de contacto",
    !C.mail.trim() ? "Falta el mail." : m.msg, 0);

  add(C.tel.replace(/\D/g,"").length>=8 ? "ok":"bad", "Teléfono",
    C.tel.trim() ? "Revisá que tenga la característica." : "Falta el teléfono.", 0);

  add(C.ciudad.trim() ? "ok":"warn", "Ciudad",
    C.ciudad.trim() ? "Sirve para saber si te queda cerca." : "Poné localidad y provincia.", 0);

  const pal = S.perfil.trim() ? S.perfil.trim().split(/\s+/).length : 0;
  add(pal>=20 && pal<=90 ? "ok" : pal===0 ? "bad" : "warn", "Perfil",
    pal===0 ? "Todavía no escribiste el perfil."
      : pal<20 ? "Muy corto: falta qué sabés hacer o qué buscás." : "Muy largo: dejalo en tres líneas.", 1);

  const expReales = S.exp.filter(e=>e.puesto.trim() || e.org.trim());
  add(expReales.length ? "ok":"bad", "Al menos una experiencia",
    expReales.length ? expReales.length+" cargada(s)." : "Sumá un trabajo, voluntariado o proyecto propio.", 2);

  const sinLogros = expReales.filter(e=>!e.bullets.some(b=>b.trim())).length;
  add(!expReales.length ? "bad" : sinLogros ? "warn":"ok", "Cada experiencia cuenta qué hiciste",
    sinLogros ? sinLogros+" experiencia(s) sin ninguna frase." : "Todas tienen al menos una frase.", 2);

  const bullets = [];
  expReales.forEach(e=>e.bullets.forEach(b=>{ if(b.trim()) bullets.push({b, tipo:e.tipo}); }));
  const flojos = bullets.filter(x=>{ const r = chequeoArranque(x.b, x.tipo); return r && r.nivel==="warn"; }).length;
  add(!bullets.length ? "warn" : flojos===0 ? "ok":"warn", "Empiezan con un verbo",
    !bullets.length ? "Todavía no hay frases para revisar."
      : flojos ? flojos+" de "+bullets.length+" arrancan flojo." : "Las "+bullets.length+" arrancan con un verbo.", 2);

  const sinNum = bullets.filter(x=>!/\d/.test(x.b)).length;
  add(!bullets.length ? "warn" : sinNum===0 ? "ok" : sinNum > bullets.length/2 ? "warn":"ok", "Tienen números",
    !bullets.length ? "Todavía no hay frases para revisar."
      : sinNum ? sinNum+" de "+bullets.length+" no tienen ninguna cifra." : "Todas dicen cuánto o cuántos.", 2);

  const conFechas = expReales.filter(e=>e.desdeAnio && (e.actual || e.hastaAnio)).length;
  const malFecha = expReales.some(e=>{
    const r = chequeoFechas(e.desdeMes,e.desdeAnio,e.hastaMes,e.hastaAnio,e.actual);
    return r && r.nivel==="bad";
  });
  add(!expReales.length ? "bad" : malFecha ? "bad" : conFechas===expReales.length ? "ok" : "warn",
    "Fechas completas",
    malFecha ? "Hay fechas de fin anteriores a las de inicio."
      : !expReales.length ? "Todavía no hay experiencias."
      : conFechas===expReales.length ? "Todas tienen mes y año."
      : (expReales.length-conFechas)+" experiencia(s) sin fechas completas.", 2);

  const eduReal = S.edu.filter(e=>e.titulo.trim());
  add(eduReal.length ? "ok":"bad", "Educación",
    eduReal.length ? eduReal.length+" cargada(s)." : "Poné al menos el secundario.", 3);

  add(S.habilidades.length>=4 ? "ok" : S.habilidades.length ? "warn":"bad", "Habilidades concretas",
    S.habilidades.length ? S.habilidades.length+" cargada(s). Apuntá a cuatro o más." : "Sumá herramientas que sepas usar.", 4);

  add(S.idiomas.filter(i=>i.idioma.trim()).length ? "ok":"warn", "Idiomas",
    S.idiomas.filter(i=>i.idioma.trim()).length ? "Cargados." : "Poné al menos tu idioma nativo.", 4);

  const todo = [C.nombre,C.ciudad,C.linkedin,S.perfil,
    ...S.exp.flatMap(e=>[e.puesto,e.org,...e.bullets]),
    ...S.edu.flatMap(e=>[e.titulo,e.inst])].join(" ");
  const sens = chequeoSensible(todo);
  add(sens ? "bad":"ok", "Datos personales de más",
    sens ? sens.msg : "No hay DNI, edad, foto ni estado civil. Bien.", null);

  add(sobra <= 0 ? "ok":"warn", "Entra en una página",
    sobra <= 0 ? "Entra justo en una hoja A4."
      : "Se pasa de la hoja. Probá el aire compacto, sacá la experiencia más vieja o acortá el perfil.", null);

  return out;
}

/* ============================================================ LA HOJA */
/* "Mar 2024" · "2024" · "Mar 2024 – Actualidad" */
function unaFecha(mes, anio){
  const m = mesCorto(mes), a = (anio||"").trim();
  if(m && a) return m + " " + a;
  return a || "";
}
function rango(dMes, dAnio, hMes, hAnio, actual){
  const a = unaFecha(dMes, dAnio);
  const b = actual ? "Actualidad" : unaFecha(hMes, hAnio);
  if(a && b) return a + " – " + b;
  return a || b || "";
}
function renderPreview(){
  const C = S.contacto;
  const vacio = !C.nombre.trim() && !S.perfil.trim() && !S.exp.some(e=>e.puesto.trim());
  let h = '<div class="doc-head'+(S.foto?" confoto":"")+'">';
  if(S.foto) h += '<img class="doc-foto" src="'+S.foto+'" alt="">';
  h += '<div class="doc-headtxt">';
  h += '<h1 class="doc-name">'+(C.nombre.trim() ? esc(capitalizarNombre(C.nombre)) : '<span class="doc-empty">Tu nombre y apellido</span>')+'</h1>';
  const cont = [C.mail, C.tel, C.ciudad, C.linkedin].filter(x=>x && x.trim());
  h += '<p class="doc-contact">'+(cont.length ? cont.map(x=>'<span>'+esc(x.trim())+'</span>').join("")
    : '<span class="doc-empty">mail · teléfono · ciudad</span>')+'</p></div></div>';

  if(S.perfil.trim())
    h += '<div class="doc-sec"><h2>Perfil</h2><p class="doc-p">'+esc(S.perfil.trim())+'</p></div>';

  const exps = S.exp.filter(e=>e.puesto.trim() || e.org.trim() || e.bullets.some(b=>b.trim()));
  if(exps.length){
    h += '<div class="doc-sec"><h2>Experiencia</h2>'+exps.map(e=>{
      const bs = e.bullets.filter(b=>b.trim());
      const kind = ({pasantia:"Pasantía",voluntariado:"Voluntariado",proyecto:"Proyecto propio"})[e.tipo];
      return '<div class="doc-item"><div class="doc-itemhead">'+
        '<p class="doc-role">'+esc(e.puesto||"—")+(kind?' <span class="doc-kind">· '+kind+'</span>':'')+'</p>'+
        '<span class="doc-dates">'+esc(rango(e.desdeMes,e.desdeAnio,e.hastaMes,e.hastaAnio,e.actual))+'</span></div>'+
        (e.org.trim()?'<p class="doc-org">'+esc(e.org)+'</p>':'')+
        (bs.length?'<ul class="doc-ul">'+bs.map(b=>'<li>'+esc(b.trim())+'</li>').join("")+'</ul>':'')+'</div>';
    }).join("")+'</div>';
  }

  const edus = S.edu.filter(e=>e.titulo.trim() || e.inst.trim());
  if(edus.length){
    h += '<div class="doc-sec"><h2>Educación</h2>'+edus.map(e=>
      '<div class="doc-item"><div class="doc-itemhead">'+
      '<p class="doc-role">'+esc(e.titulo||"—")+
      (e.estado && e.estado!=="Completo" ? ' <span class="doc-kind">· '+esc(e.estado.toLowerCase())+'</span>' : '')+'</p>'+
      '<span class="doc-dates">'+esc(rango(e.desdeMes,e.desdeAnio,e.hastaMes,e.hastaAnio,false))+'</span></div>'+
      (e.inst.trim()?'<p class="doc-org">'+esc(e.inst)+'</p>':'')+'</div>').join("")+'</div>';
  }

  const curs = S.cursos.filter(c=>c.nombre.trim());
  if(curs.length){
    h += '<div class="doc-sec"><h2>Cursos</h2>'+curs.map(c=>
      '<div class="doc-item" style="margin-bottom:5px"><div class="doc-itemhead">'+
      '<p class="doc-role" style="font-weight:600;font-size:12.7px">'+esc(c.nombre)+
      (c.inst.trim()?' <span class="doc-kind">— '+esc(c.inst)+'</span>':'')+'</p>'+
      '<span class="doc-dates">'+esc(unaFecha(c.mes,c.anio))+'</span></div></div>').join("")+'</div>';
  }

  if(S.habilidades.length)
    h += '<div class="doc-sec"><h2>Herramientas</h2><p class="doc-skills">'+
      S.habilidades.map(x=>esc(x)).join('<span class="sep">·</span>')+'</p></div>';

  const idis = S.idiomas.filter(i=>i.idioma.trim());
  if(idis.length)
    h += '<div class="doc-sec"><h2>Idiomas</h2><p class="doc-skills">'+
      idis.map(i=>esc(i.idioma)+" — "+esc(i.nivel)).join('<span class="sep">·</span>')+'</p></div>';

  if(vacio)
    h += '<div class="doc-placeholder">Acá se va armando tu CV mientras completás los pasos. La línea punteada te marca dónde termina la primera página: todo tiene que entrar arriba de esa línea.</div>';

  $("#sheetInner").innerHTML = h;
  medir();
}

let hojaZoom = false;

function medir(){
  const sheet = $("#sheet"), inner = $("#sheetInner"), scaler = $("#scaler");
  const disponible = 1123 - 56*2;
  const alto = inner.scrollHeight;
  sobra = alto - disponible;

  $("#pageMark").style.display = alto > disponible*0.72 ? "block" : "none";

  const pill = $("#fitPill");
  if(sobra > 0){ pill.className = "fitpill over"; pill.textContent = "Se pasa de una página"; }
  else{
    pill.className = "fitpill ok";
    pill.textContent = "Entra en una página · "+Math.round((alto/disponible)*100)+"% usado";
  }

  scaler.style.width = "100%";
  const w = scaler.clientWidth || 794;
  const k = hojaZoom ? 1 : Math.min(1, w/794);
  sheet.style.transform = "scale("+k+")";
  scaler.style.height = (sheet.offsetHeight * k) + "px";
  if(hojaZoom) scaler.style.width = "794px";
}

/* ============================================================ ARRANQUE */
/* El navegador usa document.title como nombre sugerido del archivo.
   El título base se guarda una sola vez: si no, dos clicks seguidos dejan
   "CV - Nombre" como título original y ya no se puede restaurar. */
const TITULO_BASE = document.title;
function descargarPDF(){
  const nombre = capitalizarNombre(S.contacto.nombre);
  document.title = nombre ? "CV - " + nombre : "CV";
  const volver = ()=>{ document.title = TITULO_BASE; };
  window.addEventListener("afterprint", volver, {once:true});
  setTimeout(volver, 60000);
  window.print();
}

  b.setAttribute("aria-pressed", hojaZoom ? "true" : "false");

  medir();
};

       edu:[blankEdu()], cursos:[], habilidades:[], idiomas:[idiomaBase()],
       diseno:{plantilla:"clasico",acento:"#2B3A42",densidad:"comodo"}, visitados:[0]};
